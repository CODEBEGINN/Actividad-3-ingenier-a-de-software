<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Formulario Unisalle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Formulario de Contacto</h1>

        <p>
            Envíanos tu mensaje utilizando el siguiente formulario.
        </p>

    </header>


    <main>

        <form  id="formulario">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                 id="nombre"  required
                placeholder="Ingresa tu nombre"
            >


            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="text"
                 id="correo"  required
                placeholder="ejemplo@correo.com"
            >


            <label for="asunto">
                Asunto
            </label>

            <input
                type="text"
                 id="asunto"  required
                placeholder="Ingresa el asunto"
            >


            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                placeholder="Escribe tu mensaje"
            ></textarea>


            <button type="submit">
                Enviar
            </button>

        </form>


        <p id="respuesta"></p>

    </main>


    <script src="app.js"></script>

    <script>
    document.getElementById('miFormulario').addEventListener('submit', async (e) => {
        e.preventDefault();

        // recolecta los datos de los campos de texto
        const datos_del_formulario = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            mensaje: document.getElementById('mensaje').value
        };

        try {
            // envia los datos al servidor backend que creamos en el puerto 3000
            const respuesta = await fetch('http://localhost:3000/api/guardar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos_del_formulario)
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {
                alert('¡Formulario enviado con éxito!');
                document.getElementById('miFormulario').reset(); // limpia los campos
            } else {
                alert('Error en el servidor: ' + resultado.error);
            }
        } catch (error) {
            alert('No se pudo conectar con el servidor backend. ¿Está encendido?');
        }
    });
</script>

</body>

</html>
